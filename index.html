<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DominoKorean's GitHub Pages</title>
    <link rel="icon" type="image/x-icon" href="https://dominokorean.github.io/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        .page-item {
            background-color: #161b22;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            align-items: flex-start;
        }
        .github-icon {
            font-size: 24px;
            margin-right: 20px;
            color: #c9d1d9;
            text-decoration: none;
        }
        .content {
            flex-grow: 1;
        }
        .page-title {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #58a6ff;
            text-decoration: none;
        }
        .page-link {
            font-size: 14px;
            color: #8b949e;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        .page-description {
            margin: 0;
            color: #c9d1d9;
        }
        a:hover {
            text-decoration: underline;
        }
        .lang-switcher {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            color: #c9d1d9;
            font-size: 14px;
            user-select: none;
        }
        .lang-switcher select {
            display: none; /* hide native select */
            background: transparent;
            color: #c9d1d9;
            border: none;
            outline: none;
        }
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: #c9d1d9;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
        }
        .lang-btn:hover,
        .lang-btn:focus-visible { background-color: #161b22; }
        .lang-icon { font-size: 20px; line-height: 1; }
        .chevron { opacity: 0.85; }
        .lang-menu {
            position: absolute;
            top: 40px;
            left: 8px;
            padding: 8px;
            min-width: 190px;
            display: none;
            border-radius: 14px;
            background: transparent;
        }
        .lang-menu.open { display: flex; flex-direction: column; gap: 6px; }
        .lang-highlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.18);
            box-shadow: 0 12px 32px rgba(2, 6, 23, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            pointer-events: none;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            transition: transform 0.28s ease, width 0.28s ease, height 0.28s ease, opacity 0.28s ease;
        }
        .lang-highlight.visible { opacity: 1; }
        .lang-item {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-size: 16px;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 12px;
            position: relative;
            z-index: 1;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .lang-item:hover,
        .lang-item:focus-visible { color: #ffffff; transform: translateY(-1px); }
        .lang-item.active { color: #ffffff; font-weight: 600; }
    </style>
    <script>
        // Prevent FOUC of wrong language (sets lang attribute early)
        (function() {
            try {
                var stored = localStorage.getItem('lang');
                var browserIsKO = (navigator.language || '').toLowerCase().startsWith('ko');
                var lang = stored || (browserIsKO ? 'ko' : 'en');
                document.documentElement.setAttribute('lang', lang);
            } catch (e) {}
        })();
    </script>
    
</head>
<body>
    <div class="lang-switcher" aria-label="Language selector">
        <select id="langSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="ko">한국어</option>
        </select>
        <button id="langBtn" class="lang-btn" aria-haspopup="true" aria-expanded="false" title="Change language">
            <span class="lang-icon" aria-hidden="true">文A</span>
            <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div id="langMenu" class="lang-menu" role="menu" aria-labelledby="langBtn">
            <div class="lang-highlight" aria-hidden="true"></div>
            <button class="lang-item" data-lang="ko" role="menuitem">Korean / 한국어</button>
            <button class="lang-item" data-lang="en" role="menuitem">English</button>
        </div>
    </div>
    <div class="container">
        <div id="pages"></div>
    </div>
    <script>
        (function() {
            const langBtn = document.getElementById('langBtn');
            const langMenu = document.getElementById('langMenu');
            const langHighlight = langMenu ? langMenu.querySelector('.lang-highlight') : null;
            const langItems = langMenu ? Array.from(langMenu.querySelectorAll('.lang-item')) : [];
            let highlightFrame = null;
            const el = {
                list: document.getElementById('pages'),
                select: document.getElementById('langSelect'),
                html: document.documentElement
            };
            const fallbackLang = 'en';
            const stored = localStorage.getItem('lang');
            const browserIsKO = (navigator.language || '').toLowerCase().startsWith('ko');
            let lang = stored || (browserIsKO ? 'ko' : 'en');
            function t(map) {
                if (!map) return '';
                return map[lang] || map[fallbackLang] || Object.values(map)[0] || '';
            }
            function setLang(newLang) {
                lang = newLang;
                try { localStorage.setItem('lang', lang); } catch (e) {}
                el.select.value = lang;
                el.html.setAttribute('lang', lang);
                // Reflect selection in custom menu
                var m = langMenu;
                if (m) {
                    Array.prototype.forEach.call(m.querySelectorAll('.lang-item'), function(b){
                        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
                    });
                    if (m.classList.contains('open')) {
                        syncHighlightToActive();
                    }
                }
                render();
            }
            async function fetchList() {
                try {
                    const res = await fetch('list.json', { cache: 'no-store' });
                    if (!res.ok) throw new Error('Failed to load list.json');
                    return await res.json();
                } catch (e) {
                    console.error(e);
                    return [];
                }
            }
            let cache = [];
            function createItem(item) {
                const wrapper = document.createElement('div');
                wrapper.className = 'page-item';
                const iconLink = document.createElement('a');
                iconLink.className = 'github-icon';
                iconLink.href = item.repo || item.url || '#';
                iconLink.target = '_blank';
                iconLink.rel = 'noopener noreferrer';
                iconLink.innerHTML = '<i class="fab fa-github" aria-hidden="true"></i>';
                const content = document.createElement('div');
                content.className = 'content';
                const titleA = document.createElement('a');
                titleA.className = 'page-title';
                titleA.href = item.url || '#';
                titleA.target = '_blank';
                titleA.rel = 'noopener noreferrer';
                titleA.textContent = t(item.title) || (item.url || '');
                const linkA = document.createElement('a');
                linkA.className = 'page-link';
                linkA.href = item.url || '#';
                linkA.target = '_blank';
                linkA.rel = 'noopener noreferrer';
                linkA.textContent = item.url || '';
                const descP = document.createElement('p');
                descP.className = 'page-description';
                descP.textContent = t(item.description);
                content.appendChild(titleA);
                content.appendChild(linkA);
                content.appendChild(descP);
                wrapper.appendChild(iconLink);
                wrapper.appendChild(content);
                return wrapper;
            }
            async function render() {
                if (!cache.length) {
                    cache = await fetchList();
                }
                el.list.innerHTML = '';
                cache.forEach(item => {
                    el.list.appendChild(createItem(item));
                });
            }
            // Init
            setLang(lang);
            el.select.addEventListener('change', (e) => setLang(e.target.value));

            // Custom dropdown interactions (icon + chevron)
            function applyHighlight(target) {
                if (!langHighlight || !target) return;
                const { offsetLeft, offsetTop, offsetWidth, offsetHeight } = target;
                langHighlight.style.width = offsetWidth + 'px';
                langHighlight.style.height = offsetHeight + 'px';
                langHighlight.style.transform = `translate3d(${offsetLeft}px, ${offsetTop}px, 0)`;
            }
            function showHighlight(target) {
                if (!langHighlight || !langMenu || !langMenu.classList.contains('open') || !target) return;
                if (highlightFrame) cancelAnimationFrame(highlightFrame);
                highlightFrame = requestAnimationFrame(() => {
                    langHighlight.classList.add('visible');
                    applyHighlight(target);
                    highlightFrame = null;
                });
            }
            function syncHighlightToActive() {
                if (!langMenu || !langHighlight || !langMenu.classList.contains('open')) return;
                const active = langMenu.querySelector('.lang-item.active') || langItems[0];
                if (active) {
                    showHighlight(active);
                }
            }
            function hideHighlight() {
                if (!langHighlight) return;
                if (highlightFrame) {
                    cancelAnimationFrame(highlightFrame);
                    highlightFrame = null;
                }
                langHighlight.classList.remove('visible');
            }
            function closeMenu() {
                if (!langMenu) return;
                langMenu.classList.remove('open');
                langBtn && langBtn.setAttribute('aria-expanded', 'false');
                hideHighlight();
            }
            function openMenu() {
                if (!langMenu) return;
                langMenu.classList.add('open');
                langBtn && langBtn.setAttribute('aria-expanded', 'true');
                syncHighlightToActive();
            }
            if (langBtn && langMenu) {
                langBtn.addEventListener('click', () => {
                    const isOpen = langMenu.classList.contains('open');
                    isOpen ? closeMenu() : openMenu();
                });
                langItems.forEach((item) => {
                    item.addEventListener('mouseenter', () => showHighlight(item));
                    item.addEventListener('focus', () => showHighlight(item));
                });
                langMenu.addEventListener('click', (e) => {
                    const target = e.target.closest('.lang-item');
                    if (!target) return;
                    const newLang = target.getAttribute('data-lang');
                    setLang(newLang);
                    closeMenu();
                });
                langMenu.addEventListener('mouseleave', () => syncHighlightToActive());
                document.addEventListener('click', (e) => {
                    if (!langMenu.contains(e.target) && !langBtn.contains(e.target)) {
                        closeMenu();
                    }
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeMenu();
                });
            }
        })();
    </script>
</body>
</html>
